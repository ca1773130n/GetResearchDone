name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify version consistency
        id: version
        run: |
          VERSION_FILE=$(cat VERSION)
          PLUGIN_VERSION=$(node -e "console.log(require('./.claude-plugin/plugin.json').version)")
          CHANGELOG_HAS=$(grep -c "\[$VERSION_FILE\]" docs/CHANGELOG.md || true)
          echo "VERSION file: $VERSION_FILE"
          echo "plugin.json:  $PLUGIN_VERSION"
          echo "CHANGELOG:    $CHANGELOG_HAS match(es)"
          if [ "$VERSION_FILE" != "$PLUGIN_VERSION" ]; then
            echo "::error::VERSION ($VERSION_FILE) does not match plugin.json ($PLUGIN_VERSION)"
            exit 1
          fi
          if [ "$CHANGELOG_HAS" -eq 0 ]; then
            echo "::error::CHANGELOG.md has no entry for version $VERSION_FILE"
            exit 1
          fi
          echo "Version consistency: OK"
          echo "version=$VERSION_FILE" >> $GITHUB_OUTPUT

      - name: Run full test suite
        # The release gate verifies tests PASS; it does not re-enforce per-file
        # coverage thresholds. Some suites need binaries/env absent on the CI
        # runner (claude/codex/git) and are skipped, which lowers per-file
        # coverage below thresholds even with zero test failures — `jest
        # --coverage` would then exit non-zero. `--coverageThreshold={}` clears
        # enforcement while still running every collectable suite.
        #
        # NOTE: this used to say "coverage is gated on push-CI (ci.yml)". That
        # workflow was deleted in 3bb573a, so nothing enforces the per-file
        # thresholds automatically any more — only a local `npm test` does.
        # Restoring a push-CI job is the fix; until then, do not read this step
        # as "coverage is checked elsewhere".
        run: npm test -- --coverageThreshold='{}'

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Flag-based extraction: print the "## [$VERSION]" header, then every
          # line until the NEXT "## [" section. A naive awk range
          # (/start/,/end/) is WRONG here — the version header matches BOTH the
          # start and the end pattern "^## \[", so the range closes on the same
          # line it opens and yields one line. The flag form gates the end
          # pattern on f so it only fires at the following section.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; print; next }
            /^## \[/ && f { exit }
            f { print }
          ' docs/CHANGELOG.md > release-notes.md
          echo "--- Release Notes ---"
          cat release-notes.md
          test -s release-notes.md || { echo "::error::release notes are empty for $VERSION"; exit 1; }

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: true
