<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRD — Live Project Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #fafafa; color: #1f2328; }
    header { background: #1f2328; color: #fff; padding: 1.5rem 2rem; }
    header h1 { margin: 0; font-size: 1.5rem; }
    header p { margin: .25rem 0 0; opacity: .8; font-size: .95rem; }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 90px); }
    nav { background: #f0f0f0; border-right: 1px solid #d0d7de; padding: 1rem; overflow-y: auto; }
    nav h2 { font-size: .8rem; text-transform: uppercase; color: #57606a; margin: 1rem 0 .5rem; letter-spacing: .05em; }
    nav h2:first-child { margin-top: 0; }
    nav a { display: block; padding: .25rem .5rem; color: #1f2328; text-decoration: none; border-radius: 4px; font-size: .9rem; cursor: pointer; }
    nav a:hover { background: #e0e7ed; }
    nav a.active { background: #0969da; color: #fff; }
    article { padding: 2rem 3rem; max-width: 980px; }
    article h2 { margin-top: 0; }
    article pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: .85rem; white-space: pre-wrap; }
    footer { padding: 1rem 2rem; background: #1f2328; color: #b0b0b0; font-size: .85rem; text-align: center; }
    footer a { color: #74c0fc; }
  </style>
</head>
<body>
  <header>
    <h1>🔄 GRD Live Project Demo</h1>
    <p>Read-only viewer for a representative <code>.planning/</code> tree.</p>
  </header>
  <main>
    <nav id="nav"></nav>
    <article>
      <h2 id="filename">PROJECT.md</h2>
      <pre id="content"></pre>
    </article>
  </main>
  <footer>
    Generated by <code>gd-demo-build</code>. See <a href="https://github.com/ca1773130n/GetResearchDone">the full repo</a> and <a href="https://github.com/ca1773130n/GetResearchDone/blob/main/docs/ouroboros-loop.md">the Ouroboros loop technical report</a>.
  </footer>

  <script>
  (function () {
    // Self-contained demo dataset. Each value is treated as plain text and
    // rendered via .textContent — no HTML injection path exists. To point
    // this viewer at a real project snapshot, run `node scripts/build-demo.js`
    // (future) which regenerates DEMO_TREE from a .planning/ tree.
    var DEMO_TREE = {
      'PROJECT.md': {
        section: 'overview',
        title: 'PROJECT.md',
        body: '# Get Research Done\n\nGoal: build a multi-backend agent framework with closed-loop self-monitoring.\n\n## Concepts (ontology)\n\nphase · plan · verify · reflect · drift · genome · dead-end · refinement · evolve · autopilot\n\n## Targets\n\n- Primary: end-to-end Ouroboros loop runs without human input across >=10 evolve iterations\n- Secondary: Singularity >= 80% on most-recent release window\n- Constraint: zero LLM-judged scoring on the core verification path'
      },
      'STATE.md': {
        section: 'overview',
        title: 'STATE.md',
        body: '# State\n\nUpdated: 2026-05-24\nActive phase: N/A — autonomous evolve loop\nLast evolve cycle: completed (singularity 92.2%)\n\n## Recent Reflections\n\n- Phase 27: verdict=confirmed   — drift score now informational\n- Phase 28: verdict=partial     — knowhow audit needs phase-dir scan\n- Phase 29: verdict=falsified   -> promoted to DEAD-ENDS.md (slug: prefix-trim-without-segment-check)'
      },
      'DEAD-ENDS.md': {
        section: 'ouroboros',
        title: 'DEAD-ENDS.md',
        body: '# Falsified approaches\n\nApproaches the planner is forbidden from re-proposing.\n\n## prefix-trim-without-segment-check\n\n```yaml\nslug: prefix-trim-without-segment-check\nphase_number: "29"\nhypothesis: "filePath.includes(\'..\') correctly detects path traversal"\npredicted_outcome: "path-traversal warnings on all unsafe paths"\nactual_outcome: "false positives on legitimate names like file..backup.ts"\nwhy_failed: "Substring match catches embedded dots in filenames"\nevidence:\n  - phase: "29-VERIFICATION.md"\n  - commit: "66b80d5"\n  - dead_end_added_via: "promote-from-phase"\n```'
      },
      'GENOME.md': {
        section: 'ouroboros',
        title: 'GENOME.md',
        body: '# Strategy Genome\n\n## Heuristics in use\n\n- Use safeReadMarkdown (not safeReadFile) for any planning artifact — split-index files must round-trip\n- Phase IDs are component-wise compared (01.10 > 01.9), never floats\n- All write paths use atomicWriteFileSync so prior content survives a crash\n- Codex rescue is non-negotiable for evolve-generated CLI commands\n\n## Verdict thresholds\n\n- Auto-promote falsified verdicts to DEAD-ENDS only if Evidence Standard satisfied\n- Stop autopilot on ontology similarity >= 0.95\n\n## Snapshots\n\n## Snapshot 2026-05-24\n\n| Field | Value |\n|---|---|\n| completed_phases       | 47 |\n| drift_weighted         | 0.18 (below threshold 0.30) |\n| dead_ends_registered   | 12 |\n| verdicts.confirmed     | 38 |\n| verdicts.partial       | 5 |\n| verdicts.falsified     | 4 |'
      },
      'health.json': {
        section: 'live',
        title: 'gd health (live)',
        body: '{\n  "blockers": [],\n  "drift": {\n    "weighted": 0.18,\n    "threshold": 0.30,\n    "exceeded": false,\n    "weights": { "goal": 0.5, "constraint": 0.3, "ontology": 0.2 },\n    "goal":       { "score": 0.21, "sufficient_data": true },\n    "constraint": { "score": 0.15, "sufficient_data": true },\n    "ontology":   { "score": 0.12, "sufficient_data": true }\n  },\n  "config_drift": { "missing_keys": [], "deprecated_keys": [] }\n}'
      },
      'singularity.json': {
        section: 'live',
        title: 'gd singularity (live)',
        body: '# Singularity Report\n\nWindow:       v0.3.24..HEAD\nSingularity:  92.2%\n\n| Source     | Commits | LOC added | LOC removed |\n|------------|--------:|----------:|------------:|\n| gd evolve  |      43 |     8,757 |       1,110 |\n| total      |      59 |     9,493 |       1,229 |'
      }
    };

    var sectionsOrder = ['overview', 'ouroboros', 'live'];
    var sectionLabels = { overview: 'Overview', ouroboros: 'Ouroboros primitives', live: 'Live metrics' };

    var nav = document.getElementById('nav');
    var content = document.getElementById('content');
    var filenameEl = document.getElementById('filename');
    var sectionEls = {};

    sectionsOrder.forEach(function (s) {
      var h = document.createElement('h2');
      h.textContent = sectionLabels[s];
      nav.appendChild(h);
      sectionEls[s] = document.createElement('div');
      nav.appendChild(sectionEls[s]);
    });

    function render(filename) {
      var node = DEMO_TREE[filename];
      if (!node) return;
      filenameEl.textContent = node.title;
      content.textContent = node.body;  // textContent — no HTML injection path
      var links = document.querySelectorAll('nav a');
      for (var i = 0; i < links.length; i++) {
        if (links[i].dataset.file === filename) {
          links[i].classList.add('active');
        } else {
          links[i].classList.remove('active');
        }
      }
    }

    Object.keys(DEMO_TREE).forEach(function (filename) {
      var node = DEMO_TREE[filename];
      var a = document.createElement('a');
      a.textContent = node.title;
      a.dataset.file = filename;
      a.addEventListener('click', function (e) {
        e.preventDefault();
        render(filename);
      });
      sectionEls[node.section].appendChild(a);
    });

    render('PROJECT.md');
  })();
  </script>
</body>
</html>
